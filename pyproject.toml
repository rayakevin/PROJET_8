[project]
name = "projet-8-credit-scoring-mlops"
version = "0.1.0"
description = "Deployment and monitoring project for a Home Credit scoring model."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    # Legacy P6 modeling stack and imported MLflow artifact runtime.
    "category-encoders>=2.9.0",
    "cloudpickle==3.1.2",
    "defusedxml==0.7.1",
    "imbalanced-learn>=0.14.0",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "joblib>=1.5.3",
    "jupyterlab>=4.3.5",
    "lightgbm==4.6.0",
    "matplotlib==3.10.8",
    "missingno>=0.5.2",
    "mlflow==3.11.1",
    "numpy==2.4.2",
    "numba>=0.64.0",
    "llvmlite>=0.46.0",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "pyarrow==23.0.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
    "seaborn>=0.13.2",
    "shap>=0.51.0",
    "tqdm>=4.67.3",

    # Mission 8 deployment, API and monitoring stack.
    "evidently>=0.7.0",
    "fastapi>=0.115.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "streamlit>=1.40.0",
    "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pre-commit>=4.0.0",
    "pytest>=8.3.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
environments = [
    "sys_platform == 'win32'",
    "sys_platform == 'linux'",
]
