name: CI/CD API

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-scoring-api:${{ github.sha }} .

      - name: Run Docker smoke test
        run: |
          docker run -d --name credit-scoring-api -p 8000:8000 credit-scoring-api:${{ github.sha }}
          sleep 20
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/model/info
          curl --fail -X POST http://127.0.0.1:8000/predict/batch \
            -H "Content-Type: application/json" \
            --data-binary @tests/payloads/valid_raw_client.json
          docker stop credit-scoring-api

  deploy-simulation:
    name: Deploy simulation
    runs-on: ubuntu-latest
    needs: docker-build

    steps:
      - name: Simulate deployment
        run: |
          echo "Image Docker validée : credit-scoring-api:${{ github.sha }}"
          echo "Déploiement simulé OK."
