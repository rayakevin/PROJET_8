name: CI/CD API

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
  pull_request:
    branches:
      - main
      - develop

jobs:
  quality-and-tests:
    name: Quality and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync --frozen --all-extras

      - name: Run Ruff checks
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run tests
        run: uv run pytest

  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: quality-and-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t credit-scoring-api:${{ github.sha }} .

      - name: Run Docker smoke test
        run: |
          docker run -d --name credit-scoring-api -p 8000:8000 credit-scoring-api:${{ github.sha }}
          sleep 20
          curl --fail http://127.0.0.1:8000/health
          curl --fail http://127.0.0.1:8000/model/info
          curl --fail -X POST http://127.0.0.1:8000/predict/batch \
            -H "Content-Type: application/json" \
            --data-binary @tests/payloads/valid_raw_client.json
          docker stop credit-scoring-api

  deploy-hugging-face:
    name: Deploy to Hugging Face Spaces
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_USERNAME: ${{ vars.HF_USERNAME }}
      HF_SPACE_NAME: ${{ vars.HF_SPACE_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Hugging Face configuration
        run: |
          test -n "$HF_TOKEN" || (echo "Le secret HF_TOKEN est manquant." && exit 1)
          test -n "$HF_USERNAME" || (echo "La variable HF_USERNAME est manquante." && exit 1)
          test -n "$HF_SPACE_NAME" || (echo "La variable HF_SPACE_NAME est manquante." && exit 1)

      - name: Prepare Space repository
        run: |
          mkdir -p hf_space
          cp Dockerfile pyproject.toml uv.lock hf_space/
          cp -r app model hf_space/
          cat > hf_space/README.md <<'EOF'
          ---
          title: Credit Scoring API
          sdk: docker
          app_port: 8000
          pinned: false
          ---

          # Credit Scoring API

          API FastAPI de scoring crédit basée sur un modèle LightGBM TOP30 optimisé.

          ## Routes principales

          - `GET /health`
          - `GET /model/info`
          - `POST /predict`
          - `POST /predict/batch`
          EOF

      - name: Deploy to Hugging Face Spaces
        working-directory: hf_space
        run: |
          git init
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add .
          git commit -m "Deploy API from GitHub Actions"
          git branch -M main
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/$HF_USERNAME/$HF_SPACE_NAME main
