services:
  postgres-monitoring:
    image: postgres:16-alpine
    container_name: projet8_monitoring_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: projet8_monitoring
      POSTGRES_USER: projet8
      POSTGRES_PASSWORD: projet8
    ports:
      - "5433:5432"
    volumes:
      - projet8_monitoring_postgres_data:/var/lib/postgresql/data
      - ./monitoring/db/schema.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projet8 -d projet8_monitoring"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  projet8_monitoring_postgres_data:
